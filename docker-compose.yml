services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alphadesk
      POSTGRES_PASSWORD: alphadesk
      POSTGRES_DB: alphadesk
    ports:
      - "5432:5432"
    volumes:
      - alphadesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphadesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://alphadesk:alphadesk@db:5432/alphadesk
      LOG_LEVEL: INFO
      RISK_FREE_RATE: "0.065"
    volumes:
      - ./backend:/app
      - ./config:/config:ro
    working_dir: /app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  web:
    image: node:20-alpine
    working_dir: /web
    volumes:
      - ./frontend:/web
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "test -d node_modules || npm install; npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  alphadesk_pgdata:
