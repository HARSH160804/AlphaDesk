# AlphaDesk fund universe
#
# Only Direct Plan - Growth variants, verified against the mfapi.in API.
# Each entry maps a scheme_code (int) to its category and benchmark.
#
# Benchmarks are referenced by id defined below in `benchmarks:`.

benchmarks:
  - id: NIFTY_50
    name: Nifty 50
    yf_ticker: "^NSEI"
  - id: NIFTY_MIDCAP_150
    name: Nifty Midcap 150
    yf_ticker: "NIFTYMIDCAP150.NS"
  - id: NIFTY_SMALLCAP_250
    name: Nifty Smallcap 250
    yf_ticker: "NIFTYSMLCAP250.NS"
  - id: CRISIL_SHORT_BOND
    name: CRISIL Short Term Bond Fund Index (proxy)
    yf_ticker: null  # no public yfinance proxy; debt comparisons stay informational

# Scheme codes resolved against https://api.mfapi.in/mf/{code}.
# category uses one of: large_cap, mid_cap, small_cap, flexi_cap, index, short_debt.
